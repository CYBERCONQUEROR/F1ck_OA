name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # trigger manually from GitHub UI → Actions tab

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libpulse-dev \
            pulseaudio-utils \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      # ── Tagged release → publish artifacts to GitHub Releases ──────────────
      - name: Build & publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "F1ck_OA ${{ github.ref_name }}"
          releaseBody: "See assets below to download and install."
          releaseDraft: false
          prerelease: false

      # ── Manual / branch push → just build, upload as artifact ──────────────
      - name: Build (no release)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux bundle
        if: "matrix.platform == 'ubuntu-22.04' && !startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: f1ck_OA-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

      - name: Upload Windows bundle
        if: "matrix.platform == 'windows-latest' && !startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: f1ck_OA-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
